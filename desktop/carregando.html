<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- A ilha enquanto o servidor não responde. Arquivo local de propósito:
         é o que aparece justamente quando o servidor não está lá. -->
    <title>JARVIS</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      .raiz {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        padding-top: 8px;
        pointer-events: none;
      }
      .pilula {
        height: 36px;
        min-width: 172px;
        padding: 0 16px;
        box-sizing: border-box;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #000;
        box-shadow:
          0 0 0 1px rgba(120, 200, 255, 0.14),
          0 10px 30px -6px rgba(0, 0, 0, 0.55);
        color: #7d8896;
        font: 500 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
        letter-spacing: 0.3em;
      }
      .ponto {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #78c8ff;
        box-shadow: 0 0 8px rgba(120, 200, 255, 0.8);
        animation: respira 1.2s ease-in-out infinite;
      }
      .fora .ponto {
        background: #ff5a4d;
        box-shadow: 0 0 8px rgba(255, 90, 77, 0.7);
        animation: none;
      }
      @keyframes respira {
        50% {
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <div class="raiz">
      <div class="pilula" id="pilula">
        <span class="ponto"></span>
        <span id="texto">JARVIS</span>
      </div>
    </div>
    <script>
      const estado = new URLSearchParams(location.search).get("estado");
      const textos = {
        iniciando: "INICIANDO",
        reconectando: "RECONECTANDO",
        fora: "SERVIDOR FORA",
      };
      if (estado && textos[estado]) document.getElementById("texto").textContent = textos[estado];
      if (estado === "fora") document.getElementById("pilula").classList.add("fora");
    </script>
  </body>
</html>
